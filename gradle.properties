# Version des Plugins (SemVer). 0.x und Versionen mit Suffix (z.B. 1.0.0-rc.1) gelten als Vorabversion.
# Für ein Release: hier erhöhen, CHANGELOG.md ergänzen, Tag "v<version>" pushen.
version=0.1.0

# Wird vom Update-Checker und vom Modrinth-Upload genutzt.
modrinthProjectId=mrchunks
githubRepository=therealmarci/mrchunks

# Minecraft-Versionen, für die das Release auf Modrinth gelistet wird (Komma-getrennt).
supportedGameVersions=26.3

org.gradle.jvmargs=-Xmx1G
