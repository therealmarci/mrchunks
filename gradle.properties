# ------------------------------------------------------------------------------
#   Versionen (siehe docs/RELEASES.md)
# ------------------------------------------------------------------------------
# Plugin-Version
#   STA-<MAJOR>.<MINOR>.<PATCH>-bu<BUILD> = stabil, BET-... = Beta (z.B. STA-1.4.0-bu002, BET-1.4.1-bu001).
#   MAJOR = große Umbauten, MINOR = neue Funktionen, PATCH = Hotfixes. BUILD zählt die Releases einer Version
#   (jede Beta und die Stable) und beginnt bei jeder neuen Version bei 001. Eine Stable schließt ihre Version ab,
#   die nächste Beta bekommt den nächsten PATCH. 0.x gibt es nur als Beta. Setzt das Release-Skript.
#   Ältere Releases hießen "1.3.1" (Tag mc26.3-v1.3.1).
version=STA-1.3.1-bu001

# Minecraft-Version, für die dieser Branch baut. Veröffentlicht wird "mc<mcVersion>-<version>",
# z.B. mc26.3-STA-1.4.0-bu002 (Tag, JAR-Name, Modrinth-Version, Anzeige im Spiel).
mcVersion=26.3
# Paper-API, gegen die kompiliert wird (muss zu mcVersion passen).
paperApi=26.3.build.200-stable
# MRadmin-API (optional, JitPack-Tag "api-<version>" aus therealmarci/mradmin).
mradminApi=api-1.14.0
# Minecraft-Versionen, für die das Release auf Modrinth gelistet wird (Komma-getrennt, z.B. 26.3,26.3.1).
supportedGameVersions=26.3

# Wird vom Update-Checker und vom Modrinth-Upload genutzt.
modrinthProjectId=mrchunks
githubRepository=therealmarci/mrchunks
# Website mit Anleitung und Downloads - Links in plugin.yml, Update-Hinweisen und "version".
website=https://mrtechnology.marcelr.at
websiteSlug=mrchunks

org.gradle.jvmargs=-Xmx1G
