          loader-toggled: {de: Loader an/aus, en: Loader on/off}
          loader-renamed: {de: Loader umbenannt, en: Loader renamed}
          loader-resized: {de: Größe geändert, en: Size changed}
          loader-restored: {de: Block wiederhergestellt, en: Block restored}
          loader-removed-missing: {de: Gelöscht (Block fehlte), en: Deleted (block missing)}
          admin-delete: {de: "Team: Loader gelöscht", en: "Team: loader deleted"}
          admin-ban: {de: "Team: Spieler gesperrt", en: "Team: player banned"}
          admin-unban: {de: "Team: Sperre aufgehoben", en: "Team: ban lifted"}
          admin-limit: {de: "Team: Limit geändert", en: "Team: limit changed"}
          admin-reload: {de: "Team: neu geladen", en: "Team: reloaded"}
          loader-invite: {de: Eingeladen, en: Invited}
          loader-uninvite: {de: Einladung zurückgenommen, en: Invite withdrawn}
          exempt-cleared: {de: Ausgeschlossen (mrchunks.exempt), en: Excluded (mrchunks.exempt)}
          loader-lag-warning: {de: "Loader auffällig", en: "Loader suspicious"}
          loader-lag-locked: {de: Wegen Lag gesperrt, en: Locked for lag}
          loader-lag-unlocked: {de: Lag-Sperre aufgehoben, en: Lag lock lifted}
          loader-limits: {de: Eigene Grenzen gesetzt, en: Own limits set}
          loader-lock-suspended: {de: Sperre ausgesetzt, en: Lock suspended}
          loader-lock-suspension-ended: {de: Sperre gilt wieder, en: Lock applies again}
          server-paused: {de: Server-Pause, en: Server pause}
          server-resumed: {de: Pause beendet, en: Pause ended}
          server-lag-warning: {de: Server ausgelastet, en: Server under load}
          server-lag-normal: {de: Server wieder entspannt, en: Server relaxed again}
          loader-lag-shutdown: {de: Durch Lags deaktiviert, en: Disabled by lag}
          loader-lag-back: {de: Lädt wieder, en: Loading again}
          server-lag-hard-cap: {de: Harte Grenze erreicht, en: Hard cap reached}
          admin-pause-all: {de: "Team: alle pausiert", en: "Team: all paused"}
          admin-resume-all: {de: "Team: Pause aufgehoben", en: "Team: pause lifted"}
          admin-monitoring: {de: "Team: Abschaltung umgestellt", en: "Team: shutdown switched"}
          loader-lag-repeat-locked: {de: Gesperrt nach Abschaltungen, en: Locked after shutdowns}
          dummy-toggled: {de: Dummy an/aus, en: Dummy on/off}
          accounts-linked: {de: Accounts verknüpft, en: Accounts linked}
          accounts-unlinked: {de: Verknüpfung gelöst, en: Link removed}

  - id: updates
    name: {de: Updates, en: Updates}
    help: {de: Nach neuen Versionen von MRchunks suchen., en: Look for new versions of MRchunks.}
    fields:
      - key: updates.enabled
        type: bool
        name: {de: Nach Updates suchen, en: Look for updates}
        help: {de: Beim Start und danach regelmäßig. Ein Hinweis erscheint in der Konsole., en: On start and regularly afterwards. A notice appears in the console.}
      - key: updates.source
        type: choice
        when: updates.enabled
        name: {de: Quelle, en: Source}
        options:
          - {value: github, de: GitHub, en: GitHub}
          - {value: modrinth, de: Modrinth, en: Modrinth}
      - key: updates.include-prereleases
        type: bool
        when: updates.enabled
        name: {de: Auch Vorabversionen, en: Pre-releases too}
        help: {de: "Läuft eine Vorabversion (0.x), werden sie immer gemeldet.", en: "When a pre-release (0.x) runs they are always reported."}
      - key: updates.interval-hours
        type: int
        when: updates.enabled
        min: 1
        max: 168
        unit: {de: Stunden, en: hours}
        name: {de: Prüfen alle, en: Check every}
      - key: updates.notify-on-join
        type: bool
        when: updates.enabled
        name: {de: Team beim Betreten informieren, en: Tell the team on join}
        help: {de: Spieler mit mrchunks.admin.update bekommen einen Hinweis., en: Players with mrchunks.admin.update get a notice.}

  - id: gui
    name: {de: Menüs, en: Menus}
    help: {de: Die Menüs von /chunkloader und /mrchunks., en: The menus of /chunkloader and /mrchunks.}
    fields:
      - key: gui.refresh-ticks
        type: int
        min: 5
        max: 200
        unit: {de: Ticks, en: ticks}
        name: {de: Aktualisieren alle, en: Refresh every}
        help: {de: 20 Ticks = 1 Sekunde., en: 20 ticks = 1 second.}
      - key: gui.confirm-seconds
        type: int
        min: 1
        max: 60
        unit: {de: Sekunden, en: seconds}
        name: {de: Zeit für den Bestätigungs-Klick, en: Time for the confirm click}
        help: {de: Löschen braucht einen zweiten Klick (Schutz vor Fehlklicks)., en: Deleting needs a second click (protection against misclicks).}
      - key: gui.ban-durations
        type: strings
        count: 3
        item: duration
        permanent: true
        name: {de: Schnellwahl Sperre, en: Quick choices ban}
        help: {de: "Genau drei Dauern im Admin-Menü, „permanent“ = für immer.", en: "Exactly three durations in the admin menu, \"permanent\" = forever."}
      - key: gui.sounds
        type: bool
        name: {de: Klickgeräusche, en: Click sounds}
      - key: gui.max-name-length
        type: int
        min: 3
        max: 64
        unit: {de: Zeichen, en: characters}
        name: {de: Längster Loader-Name, en: Longest loader name}
