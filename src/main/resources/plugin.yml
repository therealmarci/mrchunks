name: MRchunks
version: '${version}'
main: at.marcelr.mrchunks.MRChunks
api-version: '${mcVersion}'
softdepend: [squaremap, MRadmin]
author: _therealmarci
website: https://github.com/${githubRepository}
description: Chunkloader-Blöcke mit Limits, Menüs, Admin-GUI, squaremap-Anbindung und Discord-Logs.

commands:
  chunkloader:
    description: Menü mit deinen Chunkloadern - holen, zurückgeben, verwalten, teilen, Webkarte und Hilfe.
    usage: /chunkloader
    aliases: [cl, chunkloaders]
  mrchunks:
    description: Verwaltung von MRchunks.
    usage: /mrchunks <gui|tp|toggle|delete|unlock|lag|limit|ban|unban|bans|link|unlink|map|discord|reload|version>

permissions:
  mrchunks.player:
    description: Alle Spieler-Rechte auf einmal (use, map, view, invite, link) - z.B. für die Default-Gruppe in LuckPerms.
    default: op
    children:
      mrchunks.use: true
      mrchunks.map: true
      mrchunks.view: true
      mrchunks.invite: true
      mrchunks.link: true
  mrchunks.use:
    description: Chunkloader holen (/chunkloader), setzen und die eigenen verwalten.
    default: op
  mrchunks.map:
    description: Knopf "Webkarte" in /chunkloader - Link zur Webkarte.
    default: op
  mrchunks.view:
    description: Das Menü fremder Chunkloader öffnen (nur ansehen und Grenze anzeigen).
    default: op
  mrchunks.invite:
    description: Andere Spieler einladen, die eigenen Chunkloader an- und auszuschalten.
    default: op
  mrchunks.link:
    description: Einen anderen Account (z.B. Zweit-Account) mit dem eigenen verknüpfen - beide teilen sich Chunkloader und Limit.
    default: op
  mrchunks.exempt:
    description: Schließt vom Chunkloading komplett aus (z.B. Zweit-Accounts) - keine Loader, keine Einladungen. Vorhandene Loader werden gelöscht. Achtung, "*" in LuckPerms enthält das auch!
    default: false
  mrchunks.limit.unlimited:
    description: Beliebig viele Chunkloader. Feste Grenzen gehen per mrchunks.limit.<anzahl>, z.B. mrchunks.limit.10.
    default: false
  mrchunks.active.unlimited:
    description: Beliebig viele gleichzeitig aktive Chunkloader. Feste Grenzen per mrchunks.active.<anzahl>, z.B. mrchunks.active.3.
    default: false
  mrchunks.dummies.unlimited:
    description: Beliebig viele Dummy-Spieler. Feste Grenzen per mrchunks.dummies.<anzahl>, z.B. mrchunks.dummies.2.
    default: false
  mrchunks.admin:
    description: Alle Admin-Rechte von MRchunks.
    default: op
    children:
      mrchunks.admin.gui: true
      mrchunks.admin.manage: true
      mrchunks.admin.teleport: true
      mrchunks.admin.limit: true
      mrchunks.admin.ban: true
      mrchunks.admin.map: true
      mrchunks.admin.discord: true
      mrchunks.admin.reload: true
      mrchunks.admin.update: true
  mrchunks.admin.gui:
    description: /mrchunks gui - Admin-Menü öffnen (Aktionen darin brauchen ihre eigene Permission).
    default: op
  mrchunks.admin.manage:
    description: Fremde Chunkloader aktivieren/deaktivieren und löschen, Dummies schalten, Accounts verknüpfen und lösen.
    default: op
  mrchunks.admin.teleport:
    description: Zu Chunkloadern teleportieren.
    default: op
  mrchunks.admin.limit:
    description: Individuelle Limits vergeben (/mrchunks limit <spieler> <place|active|dummy> <anzahl>).
    default: op
  mrchunks.admin.ban:
    description: Spieler für Chunkloader sperren und entsperren.
    default: op
  mrchunks.admin.map:
    description: /mrchunks map [setup] - Status der Webkarte, squaremap einrichten.
    default: op
  mrchunks.admin.discord:
    description: /mrchunks discord [test]
    default: op
  mrchunks.admin.reload:
    description: /mrchunks reload
    default: op
  mrchunks.admin.update:
    description: Hinweis beim Betreten des Servers, wenn ein Update verfügbar ist.
    default: op
