name: MRchunks
version: '${version}'
main: at.marcelr.mrchunks.MRChunks
api-version: '26.3'
softdepend: [squaremap]
author: _therealmarci
website: https://github.com/${githubRepository}
description: Chunkloader-Blöcke mit Limits, Menüs, Admin-GUI, Webkarte und Discord-Logs.

commands:
  chunkloader:
    description: Chunkloader holen, entfernen, auflisten und Infos anzeigen.
    usage: /chunkloader <give|remove|list|info|map>
    aliases: [cl, chunkloaders]
  mrchunks:
    description: Verwaltung von MRchunks.
    usage: /mrchunks <gui|list|tp|toggle|delete|limit|ban|unban|bans|web|discord|reload|version>

permissions:
  mrchunks.use:
    description: Chunkloader holen (/chunkloader give|remove|list), setzen und die eigenen verwalten.
    default: true
  mrchunks.info:
    description: /chunkloader info
    default: true
  mrchunks.map:
    description: /chunkloader map - Link zur Webkarte.
    default: true
  mrchunks.view:
    description: Das Menü fremder Chunkloader öffnen (nur ansehen und Grenze anzeigen).
    default: true
  mrchunks.limit.unlimited:
    description: Beliebig viele Chunkloader. Feste Grenzen gehen per mrchunks.limit.<anzahl>, z.B. mrchunks.limit.10.
    default: false
  mrchunks.admin:
    description: Alle Admin-Rechte von MRchunks.
    default: op
    children:
      mrchunks.admin.gui: true
      mrchunks.admin.list: true
      mrchunks.admin.manage: true
      mrchunks.admin.teleport: true
      mrchunks.admin.limit: true
      mrchunks.admin.ban: true
      mrchunks.admin.web: true
      mrchunks.admin.discord: true
      mrchunks.admin.reload: true
      mrchunks.admin.update: true
  mrchunks.admin.gui:
    description: /mrchunks gui - Admin-Menü öffnen (Aktionen darin brauchen ihre eigene Permission).
    default: op
  mrchunks.admin.list:
    description: /mrchunks list
    default: op
  mrchunks.admin.manage:
    description: Fremde Chunkloader aktivieren/deaktivieren und löschen.
    default: op
  mrchunks.admin.teleport:
    description: Zu Chunkloadern teleportieren.
    default: op
  mrchunks.admin.limit:
    description: Individuelle Limits vergeben (/mrchunks limit).
    default: op
  mrchunks.admin.ban:
    description: Spieler für Chunkloader sperren und entsperren.
    default: op
  mrchunks.admin.web:
    description: /mrchunks web - Link zur Webkarte.
    default: op
  mrchunks.admin.discord:
    description: /mrchunks discord [test]
    default: op
  mrchunks.admin.reload:
    description: /mrchunks reload
    default: op
  mrchunks.admin.update:
    description: Hinweis beim Betreten des Servers, wenn ein Update verfügbar ist.
    default: op
