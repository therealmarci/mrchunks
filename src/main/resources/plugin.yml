name: MRchunks
version: '${version}'
main: at.marcelr.mrchunks.MRChunks
api-version: '${mcVersion}'
softdepend: [squaremap, MRadmin]
author: _therealmarci
website: ${website}/docs/${websiteSlug}/
description: Chunk loader blocks with limits, menus, admin GUI, squaremap integration and Discord logs.

commands:
  chunkloader:
    description: Menu with your chunk loaders - get, return, manage, share, web map and help.
    usage: /chunkloader
    aliases: [cl, chunkloaders]
  mrchunks:
    description: Management of MRchunks.
    usage: /mrchunks <gui|tp|toggle|delete|unlock|lag|limit|ban|unban|bans|link|unlink|map|discord|reload|version>

permissions:
  mrchunks.player:
    description: All player permissions at once (use, map, view, invite, link, block) - e.g. for the default group in LuckPerms.
    default: op
    children:
      mrchunks.use: true
      mrchunks.map: true
      mrchunks.view: true
      mrchunks.invite: true
      mrchunks.link: true
      mrchunks.block: true
  mrchunks.use:
    description: Get chunk loaders (/chunkloader), place them and manage your own.
    default: op
  mrchunks.map:
    description: Button "Web map" in /chunkloader - link to the web map.
    default: op
  mrchunks.view:
    description: Open the menu of other players' chunk loaders (view only and show the border).
    default: op
  mrchunks.invite:
    description: Invite other players to switch your own chunk loaders on and off.
    default: op
  mrchunks.link:
    description: Link another account (e.g. a second account) with your own - both share chunk loaders and limit.
    default: op
  mrchunks.block:
    description: Choose the block your chunk loaders stand as in the world (loader menu, item.block-choices).
    default: op
  mrchunks.exempt:
    description: Completely excludes from chunk loading (e.g. second accounts) - no loaders, no invites. Existing loaders are deleted. Warning, "*" in LuckPerms includes this too!
    default: false
  mrchunks.limit.unlimited:
    description: Any number of chunk loaders. Fixed limits via mrchunks.limit.<number>, e.g. mrchunks.limit.10.
    default: false
  mrchunks.active.unlimited:
    description: Any number of chunk loaders active at the same time. Fixed limits via mrchunks.active.<number>, e.g. mrchunks.active.3.
    default: false
  mrchunks.dummies.unlimited:
    description: Any number of dummy players. Fixed limits via mrchunks.dummies.<number>, e.g. mrchunks.dummies.2.
    default: false
  mrchunks.admin:
    description: All admin permissions of MRchunks.
    default: op
    children:
      mrchunks.admin.gui: true
      mrchunks.admin.manage: true
      mrchunks.admin.teleport: true
      mrchunks.admin.limit: true
      mrchunks.admin.ban: true
      mrchunks.admin.map: true
      mrchunks.admin.discord: true
      mrchunks.admin.reload: true
      mrchunks.admin.update: true
  mrchunks.admin.gui:
    description: /mrchunks gui - open the admin menu (actions in it need their own permission).
    default: op
  mrchunks.admin.manage:
    description: Switch other players' chunk loaders on/off and delete them, toggle dummies, link and unlink accounts.
    default: op
  mrchunks.admin.teleport:
    description: Teleport to chunk loaders.
    default: op
  mrchunks.admin.limit:
    description: Grant individual limits (/mrchunks limit <player> <place|active|dummy> <number>).
    default: op
  mrchunks.admin.ban:
    description: Ban and unban players from chunk loaders.
    default: op
  mrchunks.admin.map:
    description: /mrchunks map [setup] - status of the web map, set up squaremap.
    default: op
  mrchunks.admin.discord:
    description: /mrchunks discord [test]
    default: op
  mrchunks.admin.reload:
    description: /mrchunks reload
    default: op
  mrchunks.admin.update:
    description: Notice when joining the server if an update is available.
    default: op
