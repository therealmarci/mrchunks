# ==============================================================================
#   MRchunks - Configuration
# ==============================================================================
#   After changes:   /mrchunks reload   (no restart needed)
#   Admin menu:      /mrchunks gui
#   Player menu:     /chunkloader
#   Help & docs:     https://mrtechnology.marcelr.at/docs/mrchunks/
#
#   Durations: d = days, h = hours, m = minutes, s = seconds,
#              e.g. "30m", "1h30m", "7d". A plain number counts as minutes.
#
#   Texts & messages (also item, map, Discord): lang/de.yml or lang/en.yml.
#
#   This file is UTF-8 encoded. If special characters (ä, ö, ü) look wrong,
#   set the encoding in your editor to "UTF-8".
# ==============================================================================

# Do not change - used for automatic config updates.
config-version: 22

# Language of the texts (chat, menus, items). The texts are in plugins/MRchunks/lang/<language>.yml.
#   auto = every player gets the language set in their Minecraft client:
#          German (also Austria/Switzerland) -> de.yml, English -> en.yml, a language without a file -> fallback-language.
#   de / en / ... = fixed language for all players.
# The console is always English. Own language: copy a file (e.g. as fr.yml) and translate it - with "auto"
# French players then get it automatically.
language: auto

# Language for players whose Minecraft language has no file of its own.
fallback-language: en

# Language of texts that are not meant for a single player: Discord logs, the web map (squaremap),
# tickets in MRadmin.
server-language: en


# ------------------------------------------------------------------------------
#   1) CHUNK LOADERS
# ------------------------------------------------------------------------------
loaders:
  # Chunk budget: how many chunks each player may keep loaded with all their ACTIVE chunk loaders together.
  # Every player sets the size of their loaders themselves (loader menu -> Size), as rectangles. A loader costs its
  # area while it is active (7x7 = 49, 3x3 = 9, 5x11 = 55) - so a few big or many small loaders, as the player likes.
  # Switched-off loaders cost nothing. Chunks where loaders overlap count for every loader.
  # 147 = three 7x7 loaders. More via the permission "mrchunks.budget.<number>" (e.g. mrchunks.budget.300),
  # "mrchunks.budget.unlimited" or the admin command /mrchunks limit <player> budget <number>.
  default-budget: 147

  # Size of a new loader: how many chunks in each direction around the loader's own chunk.
  # 3 = 7x7 chunks, 2 = 5x5, 1 = 3x3, 0 = only its own chunk. If the free budget is too small, the new loader gets
  # the largest square that still fits; with no budget left at all it is placed switched off.
  default-reach: 3

  # Largest reach per direction a loader can be set to (7 = up to 15 chunks wide and long).
  max-reach: 7

  # How many chunk loaders each player may place (the same for everyone; switched-off ones count too).
  max-loaders: 30

  # Worlds in which no chunk loaders can be placed (name, case does not matter).
  # Chunk loaders work in all dimensions (overworld, Nether, End).
  # MRpvp's arena world is always blocked (MRpvp builds and removes the arenas there itself) - MRchunks only
  # detects it when MRadmin is installed too (the plugins talk to each other through MRadmin's module interface).
  disabled-worlds: []

  # How the chunks are kept loaded:
  #   ticket    = plugin ticket (recommended). Removed cleanly when the plugin stops.
  #   forceload = like the vanilla command /forceload. Only needed if "disable-world-ticking-when-empty"
  #               is active in the Paper config (otherwise a dimension without players stops
  #               ticking). Chunks that are already force-loaded in another way are left alone.
  load-method: ticket

  # What happens if the area of a new chunk loader overlaps existing ones?
  # (Chunks covered twice are only loaded once. If a loader is switched off or deleted, the chunks
  # another active loader covers stay loaded.)
  #   allow    = simply allow it
  #   warn     = allow it, but show a notice with the affected loaders and the border
  #   deny-own = forbid it if it overlaps the player's own loaders
  #   deny-all = forbid it if it overlaps any loader
  overlap: warn

  # If a loader block disappears after all (e.g. through WorldEdit):
  #   true  = the block is restored automatically
  #   false = the chunk loader is deleted
  restore-missing-blocks: true
  # How often this is checked (in seconds).
  check-interval-seconds: 60


# Invites: owners can invite other players to switch their chunk loaders on and off - for one loader
# (loader menu -> Members) or for all of them (/chunkloader -> Members for all loaders).
# Invited players may only switch on/off, not rename or delete. This counts towards nobody's limit,
# the owner's budget still applies. Invited players find the loaders under /chunkloader -> Shared with me.
invites:
  enabled: true
  # Choice of durations in the invite dialog ("permanent" = forever).
  durations: ["1d", "7d", "30d", "permanent"]
  # At most this many invited players per loader or for "all loaders".
  max-members: 10

# Linked accounts (e.g. a second account for AFK farming): under /chunkloader -> Linked accounts a player links
# another account with their own, the other one has to agree (both have to be online).
# Afterwards both share everything like a single player: the same chunk loaders, the budget (the one of the main
# account, i.e. the player who linked), invites and dummies. Chunk loaders the second account already had
# go to the main account. A ban applies to all linked accounts.
# Either of the two can remove the link at any time (the chunk loaders stay with the main account), and so can
# admins (/mrchunks unlink <player>). Admins can also link directly: /mrchunks link <main account> <second account>
# Players need the permission mrchunks.link for this (included in mrchunks.player).
linked-accounts:
  enabled: true
  # How many second accounts a main account may have.
  max-accounts: 1
  # How long (seconds) the other account has to accept the request.
  request-seconds: 120


# ------------------------------------------------------------------------------
#   2) DUMMY PLAYERS
# ------------------------------------------------------------------------------
# A dummy is an artificial player sitting on a chunk loader. A chunk loader alone only keeps chunks
# loaded - but for the server there is still no player nearby. That is why mobs there are almost inactive (e.g.
# they do not walk through portals), no mobs spawn and some things do not grow. A dummy counts as a player
# nearby, so such farms run as if a real player were standing next to them.
#
# The owner switches the dummy on in the chunk loader's menu. It sits on the block (visible, with the owner's
# skin) as long as the loader is active. It is invulnerable, ignored by mobs, not in the tab list
# and does not count towards the player count. For MRsleep, MRadmin and MRpvp it is not a player.
# A dummy simulates a square around itself, so it only works on square loaders with the block in the middle and
# at least 5x5 chunks (otherwise it would simulate chunks outside the loader). With a dummy on, the size can only
# be changed evenly in all directions.
#
# WARNING: dummies cost a lot more performance than a chunk loader alone (mob spawning and mob AI like a
# real player). Lag protection and server pause apply here too - if a loader is locked or paused, its
# dummy is gone as well. Dummies use server internals: if the MRchunks version does not match the server version,
# they are off (notice in the console), the rest of MRchunks works normally.
dummies:
  enabled: false
  # How many dummies each player may switch on at the same time (one per chunk loader).
  # More via the permission "mrchunks.dummies.<number>" (e.g. mrchunks.dummies.3), "mrchunks.dummies.unlimited"
  # or /mrchunks limit <player> dummy <number>.
  default-limit: 1
  # true = the dummy sits on the block, false = it stands on it.
  sit: true
  # true = the owner's skin, false = default skin.
  owner-skin: true


# ------------------------------------------------------------------------------
#   3) LAG PROTECTION
# ------------------------------------------------------------------------------
# MRchunks regularly measures what happens in the area of every active chunk loader (all chunks together).
# Every loader is judged on its own against the limits of its own area: up to 3x3 fixed limits (small-loaders),
# above that they grow with the size of the loader, but never below the 3x3 ones.
# If a loader is above "warn", it counts as suspicious: admins see it in /mrchunks lag (and in MRadmin's server
# status, if installed), plus a Discord log (at most once per hour).
# If a loader is above "lock" several times in a row, only this loader is switched off and LOCKED:
# only admins can lift the lock (loader menu or /mrchunks unlock <player> <nr>). The owner is informed.
# A value of 0 switches the respective measurement off (e.g. hoppers: { warn: 0, lock: 0 }).
lag-protection:
  enabled: true
  # Measure every this many seconds.
  sample-seconds: 30
  # After a server start, wait this many seconds (from the first tick) before judging anything: loading the worlds
  # makes the tick time spike and would otherwise switch off or lock loaders on every boot. Also applies to the
  # staged shutdown (incl. hard cap) and the server pause. 0 = no delay.
  startup-delay-seconds: 180
  # This many measurements in a row above "lock" before locking (3 x 30 s = 1.5 minutes).
  # This also applies after unlocking: it can lock again after this many new measurements at the earliest.
  lock-after-samples: 3
  # true = only lock if the server really lags at that time (average tick time from server-lag-mspt).
  #        A big farm the server copes with well is then not locked.
  # false = always lock as soon as the limits are exceeded.
  only-when-server-lags: true
  # From this average tick time (ms) the server counts as lagging (50 = 20 TPS just about held).
  server-lag-mspt: 40
  # Unconditional lock: from how many times the "lock" limit to lock even WITHOUT server lag (also only
  # after lock-after-samples measurements in a row). Only relevant with only-when-server-lags: true.
  # 1 = as soon as "lock" is exceeded, 3 = from three times the limit (e.g. 750 entities with lock 250), 1.5 works too.
  # 0 = off, then it never locks without server lag.
  force-lock-multiplier: 3
  # The limits below apply to this many chunks (49 = one 7x7 loader) and are scaled to the actual area:
  # a 5x5 loader (25 chunks) gets 25/49 of them, a 9x9 loader (81 chunks) 81/49 - for each loader on its own
  # (up to 3x3 see small-loaders).
  limits-per-chunks: 49
  limits:
    # Entities (mobs, animals, minecarts, armour stands ... including items on the ground, without players)
    entities: { warn: 100, lock: 250 }
    # Items lying on the ground
    items: { warn: 150, lock: 500 }
    # Redstone signal changes per second (clocks, large circuits)
    redstone: { warn: 500, lock: 2000 }
    # Item transfers of hoppers, droppers, hopper minecarts ... per second
    hoppers: { warn: 300, lock: 1200 }
    # Piston movements per second
    pistons: { warn: 40, lock: 150 }
    # New mobs and items per second
    spawns: { warn: 15, lock: 50 }
  # Small loaders up to max-chunks chunks (9 = 3x3) get these fixed limits instead - scaled down from the ones above
  # they would be too tight for a small farm. Bigger areas use the scaled limits, but never less than these.
  # All limits are rounded to whole numbers.
  small-loaders:
    max-chunks: 9
    limits:
      entities: { warn: 40, lock: 100 }
      items: { warn: 60, lock: 200 }
      redstone: { warn: 150, lock: 600 }
      hoppers: { warn: 100, lock: 400 }
      pistons: { warn: 15, lock: 50 }
      spawns: { warn: 6, lock: 20 }

# Server pause: if the whole server lags (no matter whether because of chunk loaders or something else), ALL chunk
# loaders release their chunks until it has recovered - afterwards they load again automatically. Whether a loader is
# on or off stays unchanged, nobody has to switch anything back on. Owners of active loaders and admins are informed
# (plus a Discord log). Measured is the server's TPS over the last minute (20 = smooth).
server-pause:
  enabled: true
  # Pause when the TPS stays below "below-tps" for this long (seconds) - short lag spikes trigger nothing.
  below-tps: 15
  pause-after-seconds: 30
  # Resume when the TPS is at least "resume-tps" for this long. A bit higher than below-tps, so the loaders
  # do not keep switching on and off when the server runs right at the limit.
  resume-tps: 18
  resume-after-seconds: 60
  # Tell owners of active loaders and admins in the chat about pausing and resuming.
  notify-owners: true

# Staged shutdown: protects the server's performance against the load of many loaders together (each one under its
# own limits). Measured is the average tick time (MSPT) over "average-seconds", so single spikes trigger nothing.
#   up to warn-mspt              everything fine
#   warn-mspt .. shutdown-mspt   warning to the team (chat + Discord), held at least min-minutes
#   above shutdown-mspt          the loader with the highest load (share of its lag limits) is "disabled by lag":
#                                it releases its chunks (and its dummy) but stays switched on. One more loader per
#                                step-seconds until the MSPT is at warn-mspt or lower again.
#   from hard-cap-mspt           hard cap: ALL loaders are disabled by lag at once (average over hard-cap-seconds,
#                                so it reacts within seconds). They come back one by one as described below.
# A loader disabled by lag stays off at least min-minutes. Afterwards, while the MSPT is at warn-mspt or lower,
# the loaders come back one by one (one per step-seconds, the most recently disabled first).
# A loader disabled more than max-shutdowns times within window-minutes is locked (only admins can lift that);
# shutdowns by the hard cap do not count for that.
# The server pause above stays the emergency brake for a server that lags badly.
staged-shutdown:
  enabled: true
  average-seconds: 60
  warn-mspt: 40
  shutdown-mspt: 45
  step-seconds: 60
  min-minutes: 5
  max-shutdowns: 2
  window-minutes: 60
  # 0 = no hard cap
  hard-cap-mspt: 70
  hard-cap-seconds: 10


# ------------------------------------------------------------------------------
#   4) ITEM & BLOCK
# ------------------------------------------------------------------------------
item:
  # Look of the chunk loader as a block and as an item.
  # Normal blocks of this type are NOT chunk loaders - only the ones from /chunkloader ("Get chunk loader").
  # Name and description of the item are in the language file (item-name, item-lore).
  material: EMERALD_BLOCK
  # Enchantment glint on the item.
  glint: true
  # Blocks owners can choose for their chunk loaders in the loader menu ("Change block", permission mrchunks.block).
  # Only the block in the world changes - menus and the item keep the material above, which is always a choice too.
  # Only solid blocks without gravity or function (no sand, chests, furnaces ...). Empty list [] = no choice.
  block-choices:
    - DIAMOND_BLOCK
    - GOLD_BLOCK
    - IRON_BLOCK
    - LAPIS_BLOCK
    - NETHERITE_BLOCK
    - AMETHYST_BLOCK
    - WAXED_COPPER_BLOCK
    - QUARTZ_BLOCK
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - GLOWSTONE
    - SEA_LANTERN
    - SHROOMLIGHT
    - PURPUR_BLOCK


# ------------------------------------------------------------------------------
#   5) BORDER DISPLAY
# ------------------------------------------------------------------------------
border:
  # The border consists of glowing lines (a "fence" at every chunk of the outer edge) that are visible
  # through blocks. Only the player themselves sees it. It follows their height and disappears after the
  # time below, when the loader is deleted or via the button in the menu.
  # Show the border automatically when a chunk loader's menu is opened (otherwise only via the button in the menu).
  show-on-open: false
  # How long the border stays visible (in seconds).
  duration-seconds: 60
  # Colour of the glow and block of the lines - for active and for switched-off chunk loaders.
  color: "#4CFF7A"
  block: LIME_CONCRETE
  inactive-color: "#A0A8A4"
  inactive-block: LIGHT_GRAY_CONCRETE
  # Thickness of the lines in blocks.
  thickness: 0.08
  # Lines from "below" blocks under to "above" blocks over the player's feet, every "line-spacing" blocks.
  below: 1
  above: 5
  line-spacing: 3


# ------------------------------------------------------------------------------
#   6) WEB MAP (squaremap)
# ------------------------------------------------------------------------------
# If the plugin squaremap is installed (https://modrinth.com/plugin/squaremap), MRchunks draws
# the loaded areas as their own layer "Chunk loaders" onto the real Minecraft map.
# Without squaremap there is no web map - apart from that MRchunks works completely normally.
squaremap:
  enabled: true
  # MRchunks keeps squaremap's config fitting, checked on every start: map updates every 5 seconds, no player
  # locations, world selection always visible, the Nether from the inside instead of the bedrock ceiling and the names
  # of the main dimensions from the language file (map-dimension-*). Missing values and values MRchunks wrote itself
  # are brought up to date (squaremap is reloaded then); values you changed in plugins/squaremap/config.yml stay.
  # Overwrite your own changes too: /mrchunks map setup. false = MRchunks never touches squaremap's config.
  auto-configure: true
  # Show players neither on the map nor in the sidebar.
  hide-players: true
  # true = the layer is hidden when the map opens (can be switched on in the layer selection).
  default-hidden: false
  # Also show switched-off chunk loaders (grey).
  show-inactive: true
  # Colour of the areas, so the map shows the state of every chunk loader at a glance:
  # "status" = active-color for active chunk loaders (switched off grey, locked red, conspicuous and paused yellow),
  # "owner" = an own, constant colour per player, or a fixed value like "#2ECC71".
  color: status
  active-color: "#2ECC71"
  inactive-color: "#8A958E"
  # Colour of active chunk loaders during a server pause (see server-pause).
  paused-color: "#F1C40F"
  # Colour by status: locked chunk loaders (lag protection) and conspicuous ones (above a warn limit) get their own
  # colour, so problems stand out on the map. false = they look like the others.
  status-colors: true
  locked-color: "#E74C3C"
  warn-color: "#F1C40F"
  # true = three layers that visitors switch on and off separately in the layer menu (top left): active,
  #        switched-off and locked chunk loaders (names in the language file, map-layer-*). Locked ones are always
  #        shown, also with show-inactive: false.
  # false = one layer for all.
  split-layers: true
  # A small figure instead of the loader icon where a dummy player sits (see dummies).
  show-dummy-icon: true
  # Opacity of the area (0.0 - 1.0).
  fill-opacity: 0.25
  # Small chunk loader icon in the middle of the area.
  show-icon: true
  # The markers are synchronised at least this often (otherwise changes appear immediately).
  update-seconds: 60
  # Address of the web map for players (button "Web map" in /chunkloader, link in the chat):
  #   ""                               = automatic: "web-address" from the squaremap config (if changed),
  #                                      otherwise server-ip from server.properties, otherwise the public IP
  #   "map.yourserver.com"             = own domain (FQDN) or IP - the squaremap port is appended
  #   "https://yourserver.com/map/"    = full URL, used exactly like that (e.g. reverse proxy with a path)
  address: ""
  # true = the map runs behind a reverse proxy (nginx, Caddy, Traefik, Cloudflare ...):
  #        the link becomes https://<address>/ without a port. Let the proxy forward to squaremap's port.
  reverse-proxy: false
  # Determine the public IP once on startup via checkip.amazonaws.com if address is empty and there is
  # no server-ip in server.properties (it only asks, nothing is sent).
  detect-public-ip: true

  # Chunk grid on the map (MRchunks adds its own grid overlay to squaremap).
  chunk-grid:
    enabled: true
    # Shown when the map opens. Visitors can switch it on/off in the layer menu (top left).
    default-visible: true
    color: "#FFFFFF"
    opacity: 0.35
    # Only draw chunk lines when a chunk is at least this many pixels wide
    # (zoomed out further the lines would just be a grey area).
    min-chunk-pixels: 8
    # Highlight region borders (32x32 chunks = one .mca file).
    region-lines: true
    region-color: "#FFD54F"
    # Write the chunk coordinates into every chunk when zoomed in a lot.
    labels: true


# ------------------------------------------------------------------------------
#   7) DISCORD LOGS
# ------------------------------------------------------------------------------
# Create a webhook: Discord channel -> Edit Channel -> Integrations -> Webhooks
#                   -> New Webhook -> Copy Webhook URL.
# The texts of the events are in the language file (lang/<language>.yml, section discord).
# An event with "enabled: false" or an empty text is not sent.
# Not working? -> /mrchunks discord shows the status, /mrchunks discord test sends a test message.
discord:
  enabled: false
  # Full URL in quotes, e.g. "https://discord.com/api/webhooks/123456/abcdef"
  webhook-url: ""
  username: "MRchunks"
  avatar-url: ""
  use-embeds: true
  footer: "Minecraft-Server"
  events:
    loader-placed:
      enabled: true
      color: "#2ECC71"
    loader-deleted:
      enabled: true
      color: "#E67E22"
    loader-toggled:
      enabled: true
      color: "#3498DB"
    loader-renamed:
      enabled: true
      color: "#1ABC9C"
    loader-resized:
      enabled: true
      color: "#1ABC9C"
    loader-restored:
      enabled: true
      color: "#F1C40F"
    loader-removed-missing:
      enabled: true
      color: "#95A5A6"
    admin-delete:
      enabled: true
      color: "#C0392B"
    admin-ban:
      enabled: true
      color: "#C0392B"
    admin-unban:
      enabled: true
      color: "#27AE60"
    admin-limit:
      enabled: true
      color: "#9B59B6"
    admin-reload:
      enabled: true
      color: "#3498DB"
    loader-invite:
      enabled: true
      color: "#1ABC9C"
    loader-uninvite:
      enabled: true
      color: "#95A5A6"
    exempt-cleared:
      enabled: true
      color: "#E74C3C"
    loader-lag-warning:
      enabled: true
      color: "#F39C12"
    loader-lag-locked:
      enabled: true
      color: "#C0392B"
    loader-lag-unlocked:
      enabled: true
      color: "#27AE60"
    server-paused:
      enabled: true
      color: "#E67E22"
    server-resumed:
      enabled: true
      color: "#27AE60"
    server-lag-warning:
      enabled: true
      color: "#F39C12"
    server-lag-normal:
      enabled: true
      color: "#27AE60"
    loader-lag-shutdown:
      enabled: true
      color: "#E67E22"
    loader-lag-back:
      enabled: true
      color: "#27AE60"
    server-lag-hard-cap:
      enabled: true
      color: "#C0392B"
    admin-pause-all:
      enabled: true
      color: "#E67E22"
    admin-resume-all:
      enabled: true
      color: "#27AE60"
    admin-monitoring:
      enabled: true
      color: "#9B59B6"
    loader-lag-repeat-locked:
      enabled: true
      color: "#C0392B"
    dummy-toggled:
      enabled: true
      color: "#9B59B6"
    accounts-linked:
      enabled: true
      color: "#1ABC9C"
    accounts-unlinked:
      enabled: true
      color: "#95A5A6"


# ------------------------------------------------------------------------------
#   8) UPDATE CHECK
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta/alpha versions. If a pre-release (0.x) is running, they are always reported.
  include-prereleases: false
  interval-hours: 6
  # Notify players with "mrchunks.admin.update" when they join the server.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   9) MENUS
# ------------------------------------------------------------------------------
gui:
  # How often open menus are refreshed (in ticks, 20 = 1 second).
  refresh-ticks: 20
  # Deleting needs a second click within this time (protection against misclicks).
  confirm-seconds: 5
  # Quick choices for bans in the admin menu ("permanent" = forever, exactly 3 entries).
  ban-durations: ["1d", "7d", "permanent"]
  sounds: true
  # Maximum length of a chunk loader's name (renaming in the menu).
  max-name-length: 24
