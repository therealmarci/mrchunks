# ==============================================================================
#   MRchunks - Konfiguration
# ==============================================================================
#   Nach Änderungen:  /mrchunks reload   (kein Neustart nötig)
#   Admin-Menü:       /mrchunks gui
#   Spieler-Menü:     /chunkloader
#
#   Zeitangaben: d = Tage, h = Stunden, m = Minuten, s = Sekunden,
#                z.B. "30m", "1h30m", "7d". Eine reine Zahl zählt als Minuten.
#
#   Texte & Nachrichten (auch Item, Karte, Discord): lang/de.yml bzw. lang/en.yml.
#
#   Diese Datei ist UTF-8-kodiert. Falls Umlaute (ä, ö, ü) falsch angezeigt werden,
#   im Editor die Kodierung auf "UTF-8" stellen.
# ==============================================================================

# Nicht ändern - wird für automatische Config-Updates verwendet.
config-version: 6

# Sprache aller Texte: de = Deutsch, en = English. Die Texte stehen in plugins/MRchunks/lang/<sprache>.yml
# und können dort angepasst werden. Eigene Sprache: Datei kopieren (z.B. fr.yml), übersetzen, language: fr.
language: de


# ------------------------------------------------------------------------------
#   1) CHUNKLOADER
# ------------------------------------------------------------------------------
loaders:
  # Wie viele Chunks in jede Richtung um den Loader geladen bleiben.
  # 3 = 7x7 Chunks (49 Chunks), 2 = 5x5, 1 = 3x3.
  radius: 3

  # Wie viele Chunkloader jeder Spieler SETZEN darf.
  # Mehr gibt es per Permission "mrchunks.limit.<anzahl>" (z.B. mrchunks.limit.15)
  # oder per Admin-Befehl /mrchunks limit <spieler> <anzahl>.
  default-limit: 3

  # Wie viele davon GLEICHZEITIG AKTIV sein dürfen (also wirklich Chunks laden).
  # Weitere gesetzte Loader bleiben deaktiviert, bis ein anderer ausgeschaltet wird.
  # Beispiel: default-limit 15 und default-active-limit 3 = 15 Loader setzen, 3 davon gleichzeitig nutzen.
  # Mehr gibt es per Permission "mrchunks.active.<anzahl>" oder per /mrchunks activelimit <spieler> <anzahl>.
  default-active-limit: 3

  # Welten, in denen keine Chunkloader gesetzt werden können (Name, Groß-/Kleinschreibung egal).
  # Chunkloader funktionieren in allen Dimensionen (Oberwelt, Nether, End).
  disabled-worlds: []

  # Wie die Chunks geladen gehalten werden:
  #   ticket    = Plugin-Ticket (empfohlen). Wird beim Stoppen des Plugins sauber entfernt.
  #   forceload = wie der Vanilla-Befehl /forceload. Nur nötig, wenn in der Paper-Config
  #               "disable-world-ticking-when-empty" aktiv ist (sonst hört eine Dimension ohne
  #               Spieler auf zu ticken). Chunks, die schon anders geforceloadet sind, bleiben unangetastet.
  load-method: ticket

  # Was passiert, wenn sich der Bereich eines neuen Chunkloaders mit bestehenden überschneidet?
  # (Doppelt abgedeckte Chunks werden nur einmal geladen. Wird ein Loader deaktiviert oder gelöscht, bleiben
  # die Chunks geladen, die ein anderer aktiver Loader abdeckt.)
  #   allow    = einfach erlauben
  #   warn     = erlauben, aber Hinweis mit den betroffenen Loadern und die Grenze anzeigen
  #   deny-own = verbieten, wenn er sich mit eigenen Loadern überschneidet
  #   deny-all = verbieten, wenn er sich mit irgendeinem Loader überschneidet
  overlap: warn

  # Verschwindet ein Loader-Block doch einmal (z.B. durch WorldEdit):
  #   true  = Block wird automatisch wiederhergestellt
  #   false = Chunkloader wird gelöscht
  restore-missing-blocks: true
  # Wie oft das geprüft wird (in Sekunden).
  check-interval-seconds: 60


# Einladungen: Owner können andere Spieler einladen, ihre Chunkloader an- und auszuschalten - für einen Loader
# (Menü des Loaders -> Mitglieder) oder für alle (/chunkloader -> Mitglieder für alle Loader).
# Eingeladene dürfen nur an/aus schalten, nicht umbenennen oder löschen. Das zählt bei niemandem zum Limit,
# das Aktiv-Limit des Owners gilt weiter. Eingeladene finden die Loader unter /chunkloader -> Mit mir geteilt.
invites:
  enabled: true
  # Auswahl der Dauer im Einladen-Dialog ("permanent" = dauerhaft).
  durations: ["1d", "7d", "30d", "permanent"]
  # Höchstens so viele Eingeladene pro Loader bzw. für "alle Loader".
  max-members: 10

# ------------------------------------------------------------------------------
#   2) LAG-SCHUTZ
# ------------------------------------------------------------------------------
# MRchunks misst regelmäßig, was im Bereich jedes aktiven Chunkloaders passiert (alle Chunks zusammen).
# Ist ein Wert über "warn", gilt der Loader als auffällig: Admins sehen ihn in /mrchunks lag (und im
# Serverzustand von MRadmin, falls installiert), dazu ein Discord-Log (höchstens einmal pro Stunde).
# Ist ein Wert mehrmals hintereinander über "lock", wird der Loader deaktiviert und GESPERRT: nur Admins können
# die Sperre aufheben (Menü des Loaders oder /mrchunks unlock <spieler> <nr>). Der Owner wird informiert.
# Ein Wert von 0 schaltet die jeweilige Messung ab (z.B. hoppers: { warn: 0, lock: 0 }).
lag-protection:
  enabled: true
  # Alle so viele Sekunden wird gemessen.
  sample-seconds: 30
  # So viele Messungen hintereinander über "lock", bevor gesperrt wird (3 x 30 s = 1,5 Minuten).
  lock-after-samples: 3
  # true = nur sperren, wenn der Server dabei wirklich laggt (durchschnittliche Tick-Zeit ab server-lag-mspt).
  #        Eine große Farm, mit der der Server gut zurechtkommt, wird dann nicht gesperrt.
  # false = immer sperren, sobald die Grenzen überschritten sind.
  only-when-server-lags: true
  # Ab dieser durchschnittlichen Tick-Zeit (ms) gilt der Server als laggend (50 = 20 TPS gerade noch gehalten).
  server-lag-mspt: 40
  # Nach dem Entsperren so lange keine neue Sperre, damit der Owner seine Farm reparieren kann.
  unlock-grace: "30m"
  # Grenzen für den gesamten Bereich eines Loaders (Standard 7x7 Chunks).
  limits:
    # Entities (Mobs, Tiere, Loren, Rüstungsständer ... inkl. Items am Boden, ohne Spieler)
    entities: { warn: 300, lock: 800 }
    # Items, die am Boden liegen
    items: { warn: 200, lock: 1000 }
    # Redstone-Signaländerungen pro Sekunde (Clocks, große Schaltungen)
    redstone: { warn: 500, lock: 2000 }
    # Item-Transfers von Trichtern, Droppern, Trichterloren ... pro Sekunde
    hoppers: { warn: 300, lock: 1200 }
    # Kolben-Bewegungen pro Sekunde
    pistons: { warn: 40, lock: 150 }
    # Neue Mobs und Items pro Sekunde
    spawns: { warn: 20, lock: 80 }

# Server-Pause: Laggt der ganze Server (egal ob wegen Chunkloadern oder etwas anderem), geben ALLE Chunkloader ihre
# Chunks frei, bis er sich erholt hat - danach laden sie automatisch wieder. An/aus der Loader bleibt unverändert,
# niemand muss etwas wieder einschalten. Owner aktiver Loader und Admins werden informiert (dazu ein Discord-Log).
# Gemessen wird die TPS des Servers über die letzte Minute (20 = flüssig).
server-pause:
  enabled: true
  # Pausieren, wenn die TPS so lange unter "below-tps" liegt (Sekunden) - kurze Lag-Spitzen lösen nichts aus.
  below-tps: 15
  pause-after-seconds: 30
  # Fortsetzen, wenn die TPS so lange mindestens "resume-tps" ist. Etwas höher als below-tps, damit die Loader
  # nicht ständig an- und ausgehen, wenn der Server knapp an der Grenze läuft.
  resume-tps: 18
  resume-after-seconds: 60
  # Owner aktiver Loader und Admins im Chat über Pause und Fortsetzen informieren.
  notify-owners: true


# ------------------------------------------------------------------------------
#   3) ITEM & BLOCK
# ------------------------------------------------------------------------------
item:
  # Aussehen des Chunkloaders als Block und als Item.
  # Normale Blöcke dieses Typs sind KEINE Chunkloader - nur die aus /chunkloader ("Chunkloader holen").
  # Name und Beschreibung des Items stehen in der Sprachdatei (item-name, item-lore).
  material: EMERALD_BLOCK
  # Verzauberungs-Glanz auf dem Item.
  glint: true


# ------------------------------------------------------------------------------
#   4) GRENZANZEIGE
# ------------------------------------------------------------------------------
border:
  # Die Grenze besteht aus leuchtenden Linien (ein "Zaun" an jedem Chunk der Außenkante), die durch Blöcke
  # hindurch sichtbar sind. Nur der Spieler selbst sieht sie. Sie folgt seiner Höhe und verschwindet nach der
  # Zeit unten, beim Löschen des Loaders oder über den Button im Menü.
  # Grenze automatisch zeigen, wenn das Menü eines Chunkloaders geöffnet wird (sonst nur über den Button im Menü).
  show-on-open: false
  # Wie lange die Grenze sichtbar bleibt (in Sekunden).
  duration-seconds: 60
  # Farbe des Leuchtens und Block der Linien - für aktive und für deaktivierte Chunkloader.
  color: "#4CFF7A"
  block: LIME_CONCRETE
  inactive-color: "#A0A8A4"
  inactive-block: LIGHT_GRAY_CONCRETE
  # Dicke der Linien in Blöcken.
  thickness: 0.08
  # Linien von "below" Blöcken unter bis "above" Blöcken über den Füßen des Spielers, alle "line-spacing" Blöcke.
  below: 1
  above: 5
  line-spacing: 3


# ------------------------------------------------------------------------------
#   5) WEBKARTE (squaremap)
# ------------------------------------------------------------------------------
# Ist das Plugin squaremap installiert (https://modrinth.com/plugin/squaremap), zeichnet MRchunks
# die geladenen Bereiche als eigene Ebene "Chunkloader" auf die echte Minecraft-Karte ein.
# Ohne squaremap gibt es keine Webkarte - MRchunks funktioniert sonst aber ganz normal.
squaremap:
  enabled: true
  # Beim ersten Start mit squaremap stellt MRchunks dessen Config einmalig passend ein:
  # Karte aktualisiert alle 5 Sekunden, keine Spieler-Standorte, Welt-Auswahl immer sichtbar,
  # Nether von innen statt der Bedrock-Decke und die Dimensionsnamen aus der Sprachdatei (map-dimension-*).
  # Danach kannst du in plugins/squaremap/config.yml alles frei ändern. Erneut ausführen: /mrchunks map setup
  auto-configure: true
  # Spieler weder auf der Karte noch in der Seitenleiste anzeigen.
  hide-players: true
  # true = Ebene ist beim Öffnen der Karte ausgeblendet (in der Ebenen-Auswahl einschaltbar).
  default-hidden: false
  # Deaktivierte Chunkloader (grau) ebenfalls anzeigen.
  show-inactive: true
  # Farbe der Bereiche: "owner" = eigene, gleichbleibende Farbe pro Spieler, oder ein fester Wert wie "#2ECC71".
  color: owner
  inactive-color: "#8A958E"
  # Farbe aktiver Chunkloader während einer Server-Pause (siehe server-pause).
  paused-color: "#F39C12"
  # Deckkraft der Fläche (0.0 - 1.0).
  fill-opacity: 0.25
  # Kleines Chunkloader-Symbol in der Mitte des Bereichs.
  show-icon: true
  # Spätestens so oft werden die Markierungen neu abgeglichen (Änderungen erscheinen sonst sofort).
  update-seconds: 60
  # Adresse der Webkarte für Spieler (Knopf "Webkarte" in /chunkloader, Link im Chat):
  #   ""                             = automatisch: "web-address" aus der squaremap-Config (falls geändert),
  #                                    sonst server-ip aus der server.properties, sonst die öffentliche IP
  #   "map.deinserver.de"            = eigene Domain (FQDN) oder IP - der squaremap-Port wird angehängt
  #   "https://deinserver.de/karte/" = komplette URL, wird genau so verwendet (z.B. Reverse Proxy mit Pfad)
  address: ""
  # true = die Karte läuft hinter einem Reverse Proxy (nginx, Caddy, Traefik, Cloudflare ...):
  #        der Link wird zu https://<address>/ ohne Port. Den Proxy auf squaremaps Port weiterleiten lassen.
  reverse-proxy: false
  # Öffentliche IP einmal beim Start über checkip.amazonaws.com ermitteln, falls address leer ist und in der
  # server.properties keine server-ip steht (es wird nur abgefragt, nichts gesendet).
  detect-public-ip: true

  # Chunkraster auf der Karte (MRchunks ergänzt squaremap um ein eigenes Raster-Overlay).
  chunk-grid:
    enabled: true
    # Beim Öffnen der Karte eingeblendet. Besucher können es im Ebenen-Menü (oben links) ein-/ausschalten.
    default-visible: true
    color: "#FFFFFF"
    opacity: 0.35
    # Chunk-Linien erst zeichnen, wenn ein Chunk mindestens so viele Pixel breit ist
    # (weiter herausgezoomt wären die Linien nur noch eine graue Fläche).
    min-chunk-pixels: 8
    # Regionsgrenzen (32x32 Chunks = eine .mca-Datei) hervorheben.
    region-lines: true
    region-color: "#FFD54F"
    # Chunk-Koordinaten bei starkem Zoom in jeden Chunk schreiben.
    labels: true


# ------------------------------------------------------------------------------
#   6) DISCORD-LOGS
# ------------------------------------------------------------------------------
# Webhook anlegen: Discord-Kanal -> Kanal bearbeiten -> Integrationen -> Webhooks
#                  -> Neuer Webhook -> Webhook-URL kopieren.
# Die Texte der Events stehen in der Sprachdatei (lang/<sprache>.yml, Abschnitt discord).
# Ein Event mit "enabled: false" oder leerem Text wird nicht gesendet.
# Funktioniert es nicht? -> /mrchunks discord zeigt den Status, /mrchunks discord test schickt eine Testnachricht.
discord:
  enabled: false
  # Komplette URL in Anführungszeichen, z.B. "https://discord.com/api/webhooks/123456/abcdef"
  webhook-url: ""
  username: "MRchunks"
  avatar-url: ""
  use-embeds: true
  footer: "Minecraft-Server"
  events:
    loader-placed:
      enabled: true
      color: "#2ECC71"
    loader-deleted:
      enabled: true
      color: "#E67E22"
    loader-toggled:
      enabled: true
      color: "#3498DB"
    loader-renamed:
      enabled: true
      color: "#1ABC9C"
    loader-restored:
      enabled: true
      color: "#F1C40F"
    loader-removed-missing:
      enabled: true
      color: "#95A5A6"
    admin-delete:
      enabled: true
      color: "#C0392B"
    admin-ban:
      enabled: true
      color: "#C0392B"
    admin-unban:
      enabled: true
      color: "#27AE60"
    admin-limit:
      enabled: true
      color: "#9B59B6"
    admin-reload:
      enabled: true
      color: "#3498DB"
    loader-invite:
      enabled: true
      color: "#1ABC9C"
    loader-uninvite:
      enabled: true
      color: "#95A5A6"
    exempt-cleared:
      enabled: true
      color: "#E74C3C"
    loader-lag-warning:
      enabled: true
      color: "#F39C12"
    loader-lag-locked:
      enabled: true
      color: "#C0392B"
    loader-lag-unlocked:
      enabled: true
      color: "#27AE60"
    server-paused:
      enabled: true
      color: "#E67E22"
    server-resumed:
      enabled: true
      color: "#27AE60"


# ------------------------------------------------------------------------------
#   7) UPDATE-CHECK
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Quelle: "github" (GitHub Releases, Standard) oder "modrinth"
  source: github
  # Auch Beta-/Alpha-Versionen melden. Läuft selbst eine Vorabversion (0.x), werden sie immer gemeldet.
  include-prereleases: false
  interval-hours: 6
  # Spieler mit "mrchunks.admin.update" beim Betreten des Servers informieren.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   8) MENÜS
# ------------------------------------------------------------------------------
gui:
  # Wie oft offene Menüs aktualisiert werden (in Ticks, 20 = 1 Sekunde).
  refresh-ticks: 20
  # Löschen muss innerhalb dieser Zeit ein zweites Mal geklickt werden (Schutz vor Fehlklicks).
  confirm-seconds: 5
  # Schnellauswahl für Sperren im Admin-Menü ("permanent" = dauerhaft, genau 3 Einträge).
  ban-durations: ["1d", "7d", "permanent"]
  sounds: true
  # Wie lang der Name eines Chunkloaders höchstens sein darf (Umbenennen im Menü).
  max-name-length: 24
