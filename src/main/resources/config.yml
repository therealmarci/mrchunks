  # Menü eines Chunkloaders
  gui-title-loader: "<dark_gray>Chunkloader <dark_green>#<id>"
  gui-toggle-off-name: "<red>Deaktivieren"
  gui-toggle-off-lore:
    - "<gray>Die Chunks werden nicht mehr"
    - "<gray>geladen gehalten. Der Block bleibt."
  gui-toggle-on-name: "<green>Aktivieren"
  gui-toggle-on-lore:
    - "<gray>Hält die <white><size>x<size></white> Chunks"
    - "<gray>wieder geladen."
  gui-border-name: "<aqua>Grenze anzeigen"
  gui-border-lore:
    - "<gray>Zeigt <white><seconds>s</white> lang die Außengrenze"
    - "<gray>der geladenen Chunks."
  gui-delete-name: "<red>Löschen"
  gui-delete-lore:
    - "<gray>Entfernt den Block und den Chunkloader."
    - "<gray>Er zählt danach nicht mehr zu deinem Limit."
    - "<dark_red>Ersatzlos - es gibt kein Item zurück."
  gui-delete-confirm-name: "<dark_red><bold>Wirklich löschen?"
