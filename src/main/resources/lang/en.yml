help-list: "<green>/chunkloader list</green> <dark_gray>- <gray>Your chunk loaders and those shared with you (menu)"
help-map: "<green>/chunkloader map</green> <dark_gray>- <gray>Link to the web map"
help-info: "<green>/chunkloader info</green> <dark_gray>- <gray>This help"
help-version: "<green>/chunkloader version</green> <dark_gray>- <gray>Plugin version"
help-menu-hint: "<dark_gray>Right-click a chunk loader to open its menu: on/off, members, border, rename, delete."
give-ok: "<prefix><green>You received <white><count></white> chunk loader(s). <gray>(<used>/<limit> used)"
give-none-left: "<prefix><red>You have no chunk loaders left <gray>(<placed> placed, <held> in inventory, limit <limit>)."
give-partial: "<prefix><yellow>There was only room for <white><count></white> chunk loader(s)."
give-inventory-full: "<prefix><red>Your inventory is full."
remove-ok: "<prefix><green>Removed <white><count></white> chunk loader item(s) from your inventory."
remove-none: "<prefix><gray>You have no chunk loader items in your inventory."
banned: "<prefix><red>You are banned from chunk loaders <dark_gray>(<duration>, reason: <reason>)<red>."
exempt: "<prefix><red>You are excluded from chunk loading."
exempt-cleared-notify: "<prefix><red>You are excluded from chunk loading. <white><count></white> chunk loaders and your chunk loader items were removed."
map-link: "<prefix><gray>Web map with all chunk loaders: <link>"
map-link-label: "<aqua><u><url></u></aqua>"
map-unavailable: "<prefix><gray>There is currently no public web map for this server."

# --- Placing / block ---------------------------------------------------------
placed: "<prefix><green><white><name></white> placed - <white><chunks></white> chunks now stay loaded. <gray>(<placed>/<limit> placed, <active>/<active-limit> active)"
