overlap-entry-other: "<name> (<player>)"
active-limit-reached: "<prefix><red>You already have <white><active>/<active-limit></white> active chunk loaders. <gray>Disable another one first."
place-limit: "<prefix><red>You have reached your limit of <white><limit></white> chunk loaders."
place-world-disabled: "<prefix><red>Chunk loaders are not allowed in this world."
break-denied: "<prefix><red>Chunk loaders are indestructible. <gray>Right-click the block to open the menu and delete it."
toggled: "<prefix><green><white><name></white> is now <white><state></white>."
lag-metric-entities: "Entities"
lag-metric-items: "Items on the ground"
lag-metric-redstone: "Redstone/s"
lag-metric-hoppers: "Hopper transfers/s"
lag-metric-pistons: "Pistons/s"
lag-metric-spawns: "Spawns/s"
lag-locked-owner: "<prefix><red>🔒 Your chunk loader <white><name></white> was locked because of lag</red> <gray>(<metric>: <white><value></white>, limit <limit>). It stays off until an admin lifts the lock - please check your farm."
lag-locked-join: "<prefix><red>🔒 While you were away, your chunk loader <white><name></white> was locked because of lag</red> <gray>(<time>, <metric>: <white><value></white>, limit <limit>). An admin has to lift the lock."
lag-locked-staff: "<prefix><red>🔒 <white><name></white> of <white><player></white> was locked because of lag</red> <gray>(<metric>: <white><value></white>, limit <limit>) <teleport>"
