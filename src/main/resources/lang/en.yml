# ==============================================================================
#   MRchunks - language file: English (en)
# ==============================================================================
#   Activate: in config.yml  language: en
#   Own language: copy this file (e.g. as fr.yml), translate it and set language: fr.
#   Missing texts are added automatically on updates - your changes are kept.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Empty text ("") = the message is not sent.
# ==============================================================================

# Do not change - tells the plugin which texts need to be renewed on updates.
lang-version: 12

# Discord log texts (Discord markdown). Placeholders: {name} {number} {player} {admin} {world} {x} {y} {z}
# {state} {old} {owner} {scope} {time} {reason} {count} {type} {limit} {metric} {value}. On/off and colour are set in config.yml.
discord:
  test-message: "🔧 Test message from MRchunks - the webhook works!"
  loader-placed: "🟩 **{player}** placed **{name}** ({world} {x}, {y}, {z})."
  loader-deleted: "🗑️ **{player}** deleted **{name}** ({world} {x}, {y}, {z})."
  loader-toggled: "🔁 **{name}** of **{player}** is now **{state}** (changed by {admin})."
  loader-renamed: "✏️ **{old}** of **{player}** is now called **{name}** (changed by {admin})."
  loader-restored: "🧱 The block of **{name}** ({player}, {world} {x}, {y}, {z}) was missing and has been restored."
  loader-removed-missing: "❔ **{name}** of **{player}** was deleted because its block was missing."
  admin-delete: "🛠️ **{admin}** deleted **{name}** of **{player}**."
  admin-ban: "🔒 **{admin}** banned **{player}** ({time}, reason: {reason}). {count} chunk loaders deleted."
  admin-unban: "🔓 **{admin}** lifted the ban of **{player}**."
  admin-limit: "🛠️ **{admin}** set the {type} of **{player}** to **{limit}**."
  admin-reload: "🔄 **{admin}** reloaded the MRchunks configuration."
  loader-invite: "🤝 **{owner}** invited **{player}** to switch {scope} on/off ({time})."
  loader-uninvite: "👋 **{owner}** withdrew the invite of **{player}** for {scope}."
  exempt-cleared: "🚫 **{player}** is excluded from chunk loading (mrchunks.exempt) - {count} chunk loaders deleted."
  loader-lag-warning: "⚠️ **{name}** of **{player}** is conspicuous: {metric} {value} (warn limit {limit}) - {world} {x}, {y}, {z}"
  loader-lag-locked: "🔒 **{name}** of **{player}** was locked because of lag: {metric} {value} (limit {limit}) - {world} {x}, {y}, {z}"
  loader-lag-unlocked: "🔓 **{admin}** lifted the lag lock of **{name}** ({player})."
  server-paused: "⏸️ The server is lagging ({value} TPS) - all chunk loaders are paused ({count} chunks released)."
  server-resumed: "▶️ The server runs smoothly again ({value} TPS) - the chunk loaders load again (pause: {time})."
  dummy-toggled: "🧍 The dummy on **{name}** of **{player}** is now **{state}** (changed by {admin})."
  accounts-linked: "🔗 **{player}** is now linked to **{owner}** ({count} chunk loaders taken over, by {admin})."
  accounts-unlinked: "⛓️ The link of **{player}** to **{owner}** was removed (by {admin})."

# --- Chunk loader item ---------------------------------------------------------
# Placeholders: <size> (e.g. 7), <chunks> (e.g. 49)
item-name: "<green><bold>Chunk Loader"
item-lore:
  - "<gray>Keeps <white><size>x<size> chunks</white> around it loaded."
  - "<gray>Just place it - done."
  - ""
  - "<dark_gray>Right-click the block: menu"
  - "<dark_gray>Sneak + right-click: build normally"

# --- Web map (squaremap) ---------------------------------------------------------
# Names of the dimensions in the world selection (set when squaremap is configured).
map-dimension-overworld: "Overworld"
map-dimension-nether: "Nether"
map-dimension-end: "End"
# Name of the layer in the map's layer selection.
map-layer-name: "Chunk Loaders"
# Texts on the map (HTML allowed). Placeholders: {name} {number} {player} {world} {x} {y} {z} {size} {chunks} {state}
map-hover-tooltip: "{name} - {player}"
map-click-tooltip: "<b>{name}</b><br>Owner: {player}<br>Position: {x} {y} {z}<br>Area: {size}x{size} chunks<br>Status: {state}"
# Name of the chunk grid in the map's layer menu.
map-grid-label: "Chunk Grid"

# Reason entered when banning via the admin menu.
gui-ban-reason: "via the admin menu"

prefix: "<dark_gray>[<green>MRchunks</green>]</dark_gray> "

# --- General -----------------------------------------------------------------
no-permission: "<prefix><red>You don't have permission to do that."
players-only: "<prefix><red>This command can only be used by players."
player-not-found: "<prefix><red>Player <white><player></white> was not found."
loader-not-found: "<prefix><red><white><player></white> has no chunk loader no. <white><number></white>."
# Name of a chunk loader as long as the player gives it no name of its own. <number> = 1, 2, 3 ... per player
loader-default-name: "Chunk Loader <number>"
world-not-loaded: "<prefix><red>The world of <white><name></white> is not loaded right now."
invalid-duration: "<prefix><red>Invalid duration <white><input></white>. Examples: 1h, 7d, permanent"
invalid-number: "<prefix><red><white><input></white> is not a valid number."
state-active: "active"
state-inactive: "disabled"
state-paused: "paused (server is lagging)"
ban-duration-permanent: "permanent"
ban-duration-temporary: "<time> left"
ban-no-reason: "no reason given"
# Date format (Java pattern), e.g. "dd.MM.yyyy HH:mm" or "yyyy-MM-dd HH:mm"
date-format: "yyyy-MM-dd HH:mm"

# --- /chunkloader ------------------------------------------------------------
# Command help (/chunkloader): every line only appears if the player may use the command.
