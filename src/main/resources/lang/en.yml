  - "Server: <tps> TPS, <mspt> ms per tick"
  - "Measured in the loader's whole area:"
lock-details-metric: "- <metric>: <value> (warn <warn>, lock <lock>)"
pause-started: "<prefix><yellow>⏸ The server is lagging <gray>(<white><tps></white> TPS)</gray> - all chunk loaders are paused.</yellow> <gray>They load again automatically once the server has recovered (from <resume> TPS)."
