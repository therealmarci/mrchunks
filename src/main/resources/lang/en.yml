invite-cancel: "<red>Cancel"

# --- Admin -------------------------------------------------------------------
admin-usage: |-
  <prefix><gray>Admin commands:
  <green>/mrchunks gui</green> <dark_gray>- <gray>Admin menu with all players and chunk loaders
  <green>/mrchunks tp <player> <no></green> <dark_gray>- <gray>Teleport to a chunk loader
  <green>/mrchunks toggle <player> <no></green> <dark_gray>- <gray>Turn a chunk loader on/off
  <green>/mrchunks delete <player> <no></green> <dark_gray>- <gray>Delete a chunk loader
  <green>/mrchunks limit <player> <place|active> <amount|reset></green> <dark_gray>- <gray>Placeable / simultaneously active loaders
  <green>/mrchunks ban <player> [duration] [reason]</green> <dark_gray>- <gray>Ban (deletes all their loaders)
  <green>/mrchunks unban <player></green> <dark_gray>- <gray>Lift a ban
  <green>/mrchunks bans</green> <dark_gray>- <gray>All bans
  <green>/mrchunks map [setup]</green> <dark_gray>- <gray>Web map status / set up squaremap again
  <green>/mrchunks discord [test]</green> <dark_gray>- <gray>Discord status / test message
  <green>/mrchunks reload</green> <dark_gray>- <gray>Reload the configuration
  <green>/mrchunks version</green> <dark_gray>- <gray>Version & update status
reloaded: "<prefix><green>Configuration reloaded."
