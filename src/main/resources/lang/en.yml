lag-unlocked: "<prefix><green>Lag lock of <white><name></white> lifted.</green> <gray>The loader is still off - the owner can switch it on again."
lag-unlocked-owner: "<prefix><green>The lag lock of <white><name></white> was lifted by <white><admin></white>.</green> <gray>You can switch it on again - please make sure the farm no longer lags."
lag-not-locked: "<prefix><gray><white><name></white> is not locked."
lag-disabled: "<prefix><yellow>Lag protection is switched off (lag-protection.enabled) - nothing is measured."
