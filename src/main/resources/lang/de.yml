# ==============================================================================
#   MRchunks - Sprachdatei: Deutsch (de)
# ==============================================================================
#   Aktivieren: in der config.yml  language: de
#   Eigene Sprache: diese Datei kopieren (z.B. als fr.yml), übersetzen und language: fr setzen.
#   Fehlende Texte werden bei Updates automatisch ergänzt - deine Änderungen bleiben erhalten.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Leerer Text ("") = Nachricht wird nicht gesendet.
# ==============================================================================

# Texte der Discord-Logs (Markdown wie in Discord). Platzhalter: {player} {admin} {id} {world} {x} {y} {z}
# {state} {time} {reason} {count} {type} {limit}. An/aus und Farbe stehen in der config.yml.
discord:
  test-message: "🔧 Testnachricht von MRchunks - der Webhook funktioniert!"
  loader-placed: "🟩 **{player}** hat Chunkloader **#{id}** gesetzt ({world} {x}, {y}, {z})."
  loader-deleted: "🗑️ **{player}** hat Chunkloader **#{id}** gelöscht ({world} {x}, {y}, {z})."
  loader-toggled: "🔁 Chunkloader **#{id}** von **{player}** ist jetzt **{state}** (geändert von {admin})."
  loader-restored: "🧱 Der Block von Chunkloader **#{id}** ({world} {x}, {y}, {z}) fehlte und wurde wiederhergestellt."
  loader-removed-missing: "❔ Chunkloader **#{id}** von **{player}** wurde gelöscht, weil sein Block fehlte."
  admin-delete: "🛠️ **{admin}** hat Chunkloader **#{id}** von **{player}** gelöscht."
  admin-ban: "🔒 **{admin}** hat **{player}** gesperrt ({time}, Grund: {reason}). {count} Chunkloader gelöscht."
  admin-unban: "🔓 **{admin}** hat die Sperre von **{player}** aufgehoben."
  admin-limit: "🛠️ **{admin}** hat das {type} von **{player}** auf **{limit}** gesetzt."
  admin-reload: "🔄 **{admin}** hat die MRchunks-Konfiguration neu geladen."

# --- Chunkloader-Item ----------------------------------------------------------
# Platzhalter: <size> (z.B. 7), <chunks> (z.B. 49)
item-name: "<green><bold>Chunkloader"
item-lore:
  - "<gray>Hält <white><size>x<size> Chunks</white> um sich geladen."
  - "<gray>Einfach platzieren - fertig."
  - ""
  - "<dark_gray>Rechtsklick auf den Block: Menü"
  - "<dark_gray>Sneak + Rechtsklick: normal bauen"

# --- Webkarte (squaremap) --------------------------------------------------------
# Namen der Dimensionen in der Welt-Auswahl (werden bei der Einrichtung von squaremap gesetzt).
map-dimension-overworld: "Overworld"
map-dimension-nether: "Nether"
map-dimension-end: "End"
# Name der Ebene in der Ebenen-Auswahl der Karte.
map-layer-name: "Chunkloader"
# Texte auf der Karte (HTML erlaubt). Platzhalter: {id} {player} {world} {x} {y} {z} {size} {chunks} {state}
map-hover-tooltip: "Chunkloader #{id} - {player}"
map-click-tooltip: "<b>Chunkloader #{id}</b><br>Owner: {player}<br>Position: {x} {y} {z}<br>Bereich: {size}x{size} Chunks<br>Status: {state}"
# Name des Chunkrasters im Ebenen-Menü der Karte.
map-grid-label: "Chunkraster"

# Grund, der bei Sperren über das Admin-Menü eingetragen wird.
gui-ban-reason: "über das Admin-Menü"

prefix: "<dark_gray>[<green>MRchunks</green>]</dark_gray> "

# --- Allgemein ---------------------------------------------------------------
no-permission: "<prefix><red>Dazu hast du keine Berechtigung."
players-only: "<prefix><red>Dieser Befehl kann nur von Spielern genutzt werden."
player-not-found: "<prefix><red>Spieler <white><player></white> wurde nicht gefunden."
loader-not-found: "<prefix><red>Chunkloader <white>#<id></white> gibt es nicht."
invalid-duration: "<prefix><red>Ungültige Dauer <white><input></white>. Beispiele: 1h, 7d, permanent"
invalid-number: "<prefix><red><white><input></white> ist keine gültige Zahl."
state-active: "aktiv"
state-inactive: "deaktiviert"
ban-duration-permanent: "dauerhaft"
ban-duration-temporary: "noch <time>"
ban-no-reason: "kein Grund angegeben"
# Datumsformat (Java-Muster), z.B. "dd.MM.yyyy HH:mm" oder "yyyy-MM-dd HH:mm"
date-format: "dd.MM.yyyy HH:mm"

# --- /chunkloader ------------------------------------------------------------
usage: |-
  <prefix><gray>Befehle:
  <green>/chunkloader give [anzahl]</green> <dark_gray>- <gray>Chunkloader ins Inventar holen
  <green>/chunkloader remove [anzahl|all]</green> <dark_gray>- <gray>Chunkloader-Items aus dem Inventar entfernen
  <green>/chunkloader list</green> <dark_gray>- <gray>Menü mit deinen Chunkloadern
  <green>/chunkloader info</green> <dark_gray>- <gray>So funktioniert's + deine Chunkloader
  <green>/chunkloader map</green> <dark_gray>- <gray>Link zur Webkarte
give-ok: "<prefix><green>Du hast <white><count></white> Chunkloader bekommen. <gray>(<used>/<limit> belegt)"
give-none-left: "<prefix><red>Du hast kein Chunkloader-Kontingent mehr frei <gray>(<placed> gesetzt, <held> im Inventar, Limit <limit>)."
give-partial: "<prefix><yellow>Es war nur noch Platz für <white><count></white> Chunkloader."
give-inventory-full: "<prefix><red>Dein Inventar ist voll."
remove-ok: "<prefix><green><white><count></white> Chunkloader-Item(s) aus deinem Inventar entfernt."
remove-none: "<prefix><gray>Du hast keine Chunkloader-Items im Inventar."
banned: "<prefix><red>Du bist für Chunkloader gesperrt <dark_gray>(<duration>, Grund: <reason>)<red>."
info: |-
  <prefix><gray>So funktionieren Chunkloader:
  <dark_gray> » <gray>Hol dir einen mit <white>/chunkloader give</white> und platziere ihn.
  <dark_gray> » <gray>Er hält <white><size>x<size> Chunks</white> um sich dauerhaft geladen - auch wenn du offline bist.
  <dark_gray> » <gray>Dort laufen Redstone, Hopper, Öfen, Tiere und Pflanzenwachstum weiter.
  <dark_gray> » <gray>Mob-Spawning braucht weiterhin einen Spieler in der Nähe (Minecraft-Regel).
  <dark_gray> » <gray>Rechtsklick auf den Block öffnet das Menü: Grenze anzeigen, an/aus, löschen.
  <dark_gray> » <gray>Chunkloader sind unzerstörbar - entfernen nur über das Menü.
  <prefix><gray>Deine Chunkloader: <white><placed></white>/<white><limit></white> gesetzt, <white><active></white>/<white><active-limit></white> aktiv <dark_gray>(<held> als Item im Inventar)
info-entry: "<dark_gray>   #<id> <gray><world> <white><x> <y> <z></white> <dark_gray>- <state>"
map-link: "<prefix><gray>Webkarte mit allen Chunkloadern: <link>"
map-link-label: "<aqua><u><url></u></aqua>"
map-unavailable: "<prefix><gray>Für diesen Server gibt es gerade keine öffentliche Webkarte."
info-none: "<dark_gray>   (noch keine gesetzt)"

# --- Setzen / Block ----------------------------------------------------------
placed: "<prefix><green>Chunkloader <white>#<id></white> gesetzt - <white><chunks></white> Chunks bleiben jetzt geladen. <gray>(<placed>/<limit> gesetzt, <active>/<active-limit> aktiv)"
