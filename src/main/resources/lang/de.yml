# --- Admin -------------------------------------------------------------------
admin-usage: |-
  <prefix><gray>Admin-Befehle:
  <green>/mrchunks gui</green> <dark_gray>- <gray>Admin-Menü mit allen Spielern und Chunkloadern
  <green>/mrchunks tp <spieler> <nr></green> <dark_gray>- <gray>Zu einem Chunkloader teleportieren
  <green>/mrchunks toggle <spieler> <nr></green> <dark_gray>- <gray>Chunkloader an/aus
  <green>/mrchunks delete <spieler> <nr></green> <dark_gray>- <gray>Chunkloader löschen
  <green>/mrchunks unlock <spieler> <nr></green> <dark_gray>- <gray>Lag-Sperre aufheben
  <green>/mrchunks dummy <spieler> <nr></green> <dark_gray>- <gray>Dummy-Spieler an/aus
  <green>/mrchunks lag</green> <dark_gray>- <gray>Auffällige und gesperrte Chunkloader
  <green>/mrchunks limit <spieler> <budget|dummy> <anzahl|reset></green> <dark_gray>- <gray>Chunk-Budget bzw. Dummies
  <green>/mrchunks ban <spieler> [dauer] [grund]</green> <dark_gray>- <gray>Sperren (löscht alle seine Loader)
  <green>/mrchunks unban <spieler></green> <dark_gray>- <gray>Sperre aufheben
