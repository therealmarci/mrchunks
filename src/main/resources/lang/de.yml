# ==============================================================================
#   MRchunks - Sprachdatei: Deutsch (de)
# ==============================================================================
#   Aktivieren: in der config.yml  language: de
#   Eigene Sprache: diese Datei kopieren (z.B. als fr.yml), übersetzen und language: fr setzen.
#   Fehlende Texte werden bei Updates automatisch ergänzt - deine Änderungen bleiben erhalten.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Leerer Text ("") = Nachricht wird nicht gesendet.
# ==============================================================================

# Nicht ändern - damit erkennt das Plugin bei Updates, welche Texte erneuert werden müssen.
lang-version: 7

# Texte der Discord-Logs (Markdown wie in Discord). Platzhalter: {name} {number} {player} {admin} {world} {x} {y} {z}
# {state} {old} {owner} {scope} {time} {reason} {count} {type} {limit} {metric} {value}. An/aus und Farbe stehen in der config.yml.
discord:
  test-message: "🔧 Testnachricht von MRchunks - der Webhook funktioniert!"
  loader-placed: "🟩 **{player}** hat **{name}** gesetzt ({world} {x}, {y}, {z})."
  loader-deleted: "🗑️ **{player}** hat **{name}** gelöscht ({world} {x}, {y}, {z})."
  loader-toggled: "🔁 **{name}** von **{player}** ist jetzt **{state}** (geändert von {admin})."
  loader-renamed: "✏️ **{old}** von **{player}** heißt jetzt **{name}** (geändert von {admin})."
  loader-restored: "🧱 Der Block von **{name}** ({player}, {world} {x}, {y}, {z}) fehlte und wurde wiederhergestellt."
  loader-removed-missing: "❔ **{name}** von **{player}** wurde gelöscht, weil sein Block fehlte."
  admin-delete: "🛠️ **{admin}** hat **{name}** von **{player}** gelöscht."
  admin-ban: "🔒 **{admin}** hat **{player}** gesperrt ({time}, Grund: {reason}). {count} Chunkloader gelöscht."
  admin-unban: "🔓 **{admin}** hat die Sperre von **{player}** aufgehoben."
  admin-limit: "🛠️ **{admin}** hat das {type} von **{player}** auf **{limit}** gesetzt."
  admin-reload: "🔄 **{admin}** hat die MRchunks-Konfiguration neu geladen."
  loader-invite: "🤝 **{owner}** hat **{player}** eingeladen: {scope} an-/ausschalten ({time})."
  loader-uninvite: "👋 **{owner}** hat die Einladung von **{player}** für {scope} zurückgenommen."
  exempt-cleared: "🚫 **{player}** ist vom Chunkloading ausgeschlossen (mrchunks.exempt) - {count} Chunkloader gelöscht."
  loader-lag-warning: "⚠️ **{name}** von **{player}** ist auffällig: {metric} {value} (Warngrenze {limit}) - {world} {x}, {y}, {z}"
  loader-lag-locked: "🔒 **{name}** von **{player}** wurde wegen Lag gesperrt: {metric} {value} (Grenze {limit}) - {world} {x}, {y}, {z}"
  loader-lag-unlocked: "🔓 **{admin}** hat die Lag-Sperre von **{name}** ({player}) aufgehoben."

# --- Chunkloader-Item ----------------------------------------------------------
# Platzhalter: <size> (z.B. 7), <chunks> (z.B. 49)
item-name: "<green><bold>Chunkloader"
item-lore:
  - "<gray>Hält <white><size>x<size> Chunks</white> um sich geladen."
  - "<gray>Einfach platzieren - fertig."
  - ""
  - "<dark_gray>Rechtsklick auf den Block: Menü"
  - "<dark_gray>Sneak + Rechtsklick: normal bauen"

# --- Webkarte (squaremap) --------------------------------------------------------
# Namen der Dimensionen in der Welt-Auswahl (werden bei der Einrichtung von squaremap gesetzt).
map-dimension-overworld: "Overworld"
map-dimension-nether: "Nether"
map-dimension-end: "End"
# Name der Ebene in der Ebenen-Auswahl der Karte.
map-layer-name: "Chunkloader"
# Texte auf der Karte (HTML erlaubt). Platzhalter: {name} {number} {player} {world} {x} {y} {z} {size} {chunks} {state}
map-hover-tooltip: "{name} - {player}"
map-click-tooltip: "<b>{name}</b><br>Owner: {player}<br>Position: {x} {y} {z}<br>Bereich: {size}x{size} Chunks<br>Status: {state}"
# Name des Chunkrasters im Ebenen-Menü der Karte.
map-grid-label: "Chunkraster"

# Grund, der bei Sperren über das Admin-Menü eingetragen wird.
gui-ban-reason: "über das Admin-Menü"

prefix: "<dark_gray>[<green>MRchunks</green>]</dark_gray> "

# --- Allgemein ---------------------------------------------------------------
no-permission: "<prefix><red>Dazu hast du keine Berechtigung."
players-only: "<prefix><red>Dieser Befehl kann nur von Spielern genutzt werden."
