place-world-disabled: "<prefix><red>In dieser Welt sind keine Chunkloader erlaubt."
break-denied: "<prefix><red>Chunkloader sind unzerstörbar. <gray>Rechtsklick auf den Block öffnet das Menü zum Löschen."
toggled: "<prefix><green>Chunkloader <white>#<id></white> ist jetzt <white><state></white>."
deleted: "<prefix><green>Chunkloader <white>#<id></white> gelöscht."
delete-confirm: "<prefix><yellow>Zum Löschen von <white>#<id></white> noch einmal klicken."
not-owner: "<prefix><red>Das ist nicht dein Chunkloader."
owner-notify-toggled: "<prefix><gray>Dein Chunkloader <white>#<id></white> wurde von <white><admin></white> auf <white><state></white> gestellt."
owner-notify-deleted: "<prefix><gray>Dein Chunkloader <white>#<id></white> wurde von <white><admin></white> gelöscht."
border-shown: "<prefix><gray>Grenze von <white>#<id></white> wird <white><seconds>s</white> lang angezeigt."
teleported: "<prefix><gray>Zu Chunkloader <white>#<id></white> teleportiert."

# --- Admin -------------------------------------------------------------------
admin-usage: |-
  <prefix><gray>Admin-Befehle:
  <green>/mrchunks gui</green> <dark_gray>- <gray>Admin-Menü mit allen Spielern und Chunkloadern
  <green>/mrchunks list [spieler]</green> <dark_gray>- <gray>Chunkloader auflisten
  <green>/mrchunks tp <id></green> <dark_gray>- <gray>Zu einem Chunkloader teleportieren
  <green>/mrchunks toggle <id></green> <dark_gray>- <gray>Chunkloader an/aus
  <green>/mrchunks delete <id></green> <dark_gray>- <gray>Chunkloader löschen
  <green>/mrchunks limit <spieler> <anzahl|reset></green> <dark_gray>- <gray>Wie viele Loader ein Spieler setzen darf
  <green>/mrchunks activelimit <spieler> <anzahl|reset></green> <dark_gray>- <gray>Wie viele davon gleichzeitig aktiv sein dürfen
  <green>/mrchunks ban <spieler> [dauer] [grund]</green> <dark_gray>- <gray>Sperren (löscht alle seine Loader)
  <green>/mrchunks unban <spieler></green> <dark_gray>- <gray>Sperre aufheben
  <green>/mrchunks bans</green> <dark_gray>- <gray>Alle Sperren
  <green>/mrchunks map [setup]</green> <dark_gray>- <gray>Status der Webkarte / squaremap neu einrichten
  <green>/mrchunks discord [test]</green> <dark_gray>- <gray>Discord-Status / Testnachricht
  <green>/mrchunks reload</green> <dark_gray>- <gray>Konfiguration neu laden
  <green>/mrchunks version</green> <dark_gray>- <gray>Version & Update-Status
