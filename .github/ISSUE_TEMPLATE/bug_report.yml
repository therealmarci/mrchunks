name: 🐞 Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bei Problemen mit Lag-Schutz oder gesperrten Loadern bitte vorher `/mrchunks lag` ausführen.
  - type: input
    id: version
    attributes:
      label: MRchunks-Version
      description: Ausgabe von `/mrchunks version`
      placeholder: "0.5.3"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server-Version
      description: Ausgabe von `/version`
      placeholder: "Paper 26.3 Build 200"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Chunkloader in der Overworld platzieren
        2. ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Konsole / /mrchunks lag
      description: Relevante Konsolenausgabe oder Ausgabe von `/mrchunks lag`.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Geänderte Config-Werte (optional)
      description: Nur die Werte, die du gegenüber dem Standard geändert hast. Keine Webhook-URL posten!
      render: yaml
