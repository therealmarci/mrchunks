# Prüfrunde: bei jedem Push und Pull-Request, jeden Montag (neue Lücken in schon veröffentlichten Versionen) und vor
# jedem Release (die Release-Workflows rufen sie auf - ein Release entsteht nur, wenn alles grün ist).
#   - Bauen + Tests, Prüfung des Gradle-Wrappers
#   - Bibliotheken, die auf dem Server landen, gegen bekannte Lücken (OSV-Scanner, .github/scan-dependencies.sh)
#   - CodeQL (Code-Analyse auf Sicherheitsprobleme, Ergebnisse im Reiter "Security" des Repos)
# Gestoppt wird ab Schweregrad hoch/kritisch (CVSS >= 7.0), mittel/niedrig stehen nur in der Zusammenfassung.
# Fehlalarme von CodeQL im Reiter "Security" mit Begründung schließen. Ablauf: docs/RELEASES.md
name: Checks

on:
  push:
    branches: [main, beta, dev, 'mc/**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and tests (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: .
            artifact: MRchunks
            scan: runtimeClasspath
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build and tests
        run: chmod +x gradlew && ./gradlew build
      - name: List shipped libraries
        env:
          SCAN_CONFIGS: ${{ matrix.scan }}
        run: ./gradlew --init-script "$GITHUB_WORKSPACE/.github/shipped-dependencies.gradle" shippedDependencies
      - name: Check libraries for known vulnerabilities
        env:
          SCAN_TITLE: ${{ matrix.artifact }}
        run: bash "$GITHUB_WORKSPACE/.github/scan-dependencies.sh" build/shipped/gradle.lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.dir }}/build/libs/*.jar
            !${{ matrix.dir }}/build/libs/*-plain.jar
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  codeql-gate:
    name: CodeQL result
    needs: codeql
    # Pull requests from forks may not upload results - there is nothing to evaluate then.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stop on open findings with severity high/critical
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/codeql-gate.sh
